version: "3.9"

services:
  tournament:
    build: .
    container_name: lol-tournament
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - tournament-data:/app/data
    environment:
      - DB_PATH=/app/data/tournament.db
      - RIOT_API_KEY=${RIOT_API_KEY}

volumes:
  tournament-data:
    driver: local
